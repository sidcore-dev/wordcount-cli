[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordcount-cli"
version = "1.0.0"
description = "Report line/word/character counts and top word frequencies for text, with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "sidcore-dev" }]
keywords = ["text", "wordcount", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: Text Processing",
]

[project.scripts]
wordcount-cli = "wordcount_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
